<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #0f172a);
            --sec-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --text: var(--tg-theme-text-color, #f8fafc);
            --accent: #38bdf8;
            --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 16px;
            overflow-x: hidden;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #snow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .content { position: relative; z-index: 1; }

        /* Профиль в углу */
        .profile-badge {
            position: absolute; top: 0; right: 0;
            background: var(--glass);
            padding: 5px 12px; border-radius: 20px;
            display: flex; align-items: center; gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .profile-badge img { width: 24px; height: 24px; border-radius: 50%; }

        .header { margin-top: 40px; margin-bottom: 25px; }
        .balance-card {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            padding: 25px; border-radius: 24px;
            box-shadow: 0 15px 30px rgba(14, 165, 233, 0.2);
            transform: translateY(0);
            transition: transform 0.3s;
        }
        .balance-card:active { transform: translateY(5px); }

        /* Сетка меню */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .card {
            background: var(--sec-bg);
            border: 1px solid var(--glass);
            padding: 20px; border-radius: 20px;
            text-align: center; transition: 0.2s;
        }
        .card:active { transform: scale(0.95); opacity: 0.8; }
        .card i { font-size: 24px; color: var(--accent); margin-bottom: 10px; }

        /* Панель настроек */
        .settings-box {
            background: var(--sec-bg);
            border-radius: 20px; padding: 20px; margin-top: 20px;
            display: none; /* Скрыто по умолчанию */
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .set-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid var(--glass);
        }
        
        /* Переключатель (Toggle) */
        .switch {
            position: relative; inline-block; width: 40px; height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569; transition: .4s; border-radius: 20px;
        }
        input:checked + .slider { background-color: var(--accent); }
    </style>
</head>
<body>
    <canvas id="snow"></canvas>
    <div class="content">
        <div class="profile-badge" id="profile-btn">
            <span id="user-name">...</span>
            <i class="fa-solid fa-circle-user"></i>
        </div>

        <div class="header">
            <div class="balance-card">
                <div style="font-size: 12px; opacity: 0.8;">ВАШ БАЛАНС</div>
                <div style="font-size: 36px; font-weight: 800;" id="bal">0.00 ₽</div>
            </div>
        </div>

        <div class="grid" id="main-menu">
            <div class="card" onclick="showSettings()"><i class="fa-solid fa-sliders"></i><br>Настройки</div>
            <div class="card"><i class="fa-solid fa-robot"></i><br>Мои боты</div>
            <div class="card"><i class="fa-solid fa-chart-pie"></i><br>Статистика</div>
            <div class="card"><i class="fa-solid fa-wallet"></i><br>Выплаты</div>
        </div>

        <div id="settings-panel" class="settings-box">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <b style="font-size: 18px;">Настройки</b>
                <i class="fa-solid fa-xmark" onclick="hideSettings()"></i>
            </div>
            
            <div class="set-item">
                <span>Уведомления</span>
                <label class="switch">
                    <input type="checkbox" id="set-notify" onchange="saveSettings()">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="set-item">
                <span>Эффект снега</span>
                <label class="switch">
                    <input type="checkbox" id="set-snow" checked onchange="toggleSnow(this)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="set-item" style="border:none;">
                <span>Язык (RU)</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px; opacity: 0.5;"></i>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Отображение данных
        const user = tg.initDataUnsafe?.user;
        if(user) {
            document.getElementById('user-name').innerText = user.first_name;
            loadData(user.id);
        }

        function loadData(id) {
            fetch(`https://твой-воркер.workers.dev/api/creator_stats?id=${id}`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('bal').innerText = data.balance.toFixed(2) + ' ₽';
                    document.getElementById('set-notify').checked = data.settings?.notify || false;
                });
        }

        function showSettings() {
            document.getElementById('main-menu').style.opacity = '0.3';
            document.getElementById('settings-panel').style.display = 'block';
            tg.HapticFeedback.impactOccurred('medium');
        }

        function hideSettings() {
            document.getElementById('main-menu').style.opacity = '1';
            document.getElementById('settings-panel').style.display = 'none';
        }

        function saveSettings() {
            const notify = document.getElementById('set-notify').checked;
            fetch(`https://твой-воркер.workers.dev/api/save_settings`, {
                method: 'POST',
                body: JSON.stringify({ id: user.id, notify: notify })
            });
            tg.HapticFeedback.notificationOccurred('success');
        }

        function toggleSnow(el) {
            document.getElementById('snow').style.display = el.checked ? 'block' : 'none';
        }

        // --- ЛОГИКА СНЕГА ---
        const canvas = document.getElementById('snow');
        const ctx = canvas.getContext('2d');
        let flakes = [];
        function initSnow() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            for(let i=0; i<40; i++) flakes.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*2+1, d: Math.random()+0.5});
        }
        function draw() {
            ctx.clearRect(0,0,canvas.width, canvas.height); ctx.fillStyle = "white"; ctx.beginPath();
            flakes.forEach(f => { ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); f.y+=f.d; if(f.y > canvas.height) f.y = -10; });
            ctx.fill(); requestAnimationFrame(draw);
        }
        initSnow(); draw();
    </script>
</body>
</html>

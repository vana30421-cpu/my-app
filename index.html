<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #0f172a);
            --sec-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --text: var(--tg-theme-text-color, #f8fafc);
            --accent: #38bdf8;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Системная панель сверху */
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: var(--bg);
            position: sticky; top: 0; z-index: 50;
        }
        .nav-btn { background: var(--glass); border: none; color: var(--text); padding: 8px 12px; border-radius: 10px; font-size: 14px; }

        #snow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        
        .container { padding: 0 16px 16px 16px; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 15px; }

        /* Профиль и Баланс */
        .hero-section {
            background: linear-gradient(145deg, #0ea5e9, #2563eb);
            border-radius: 24px; padding: 20px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
        }

        .user-block {
            display: flex; align-items: center; gap: 12px;
            background: rgba(255,255,255,0.1); padding: 12px;
            border-radius: 18px; margin-bottom: 20px;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .menu-card {
            background: var(--sec-bg); border-radius: 20px;
            padding: 20px; text-align: center;
            border: 1px solid var(--glass); transition: 0.2s;
        }
        .menu-card:active { transform: scale(0.96); background: var(--glass); }
        .menu-card i { font-size: 22px; color: var(--accent); margin-bottom: 8px; display: block; }

        /* Модальные окна и экраны */
        .full-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 100;
            display: none; flex-direction: column;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); z-index: 200;
            display: none; align-items: center; justify-content: center;
        }
        .modal-content {
            background: var(--sec-bg); padding: 30px; border-radius: 25px;
            width: 80%; text-align: center; border: 1px solid var(--glass);
        }

        .list-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; border-bottom: 1px solid var(--glass);
        }

        .version-tag { text-align: center; opacity: 0.3; font-size: 10px; margin-top: 20px; padding-bottom: 20px; }
    </style>
</head>
<body>

<canvas id="snow"></canvas>

<div class="top-nav">
    <button class="nav-btn" onclick="tg.close()">Закрыть</button>
    <b style="font-size: 14px; opacity: 0.6;">CREATOR HUB</b>
    <button class="nav-btn" onclick="tg.close()">Свернуть</button>
</div>

<div class="container">
    <div class="hero-section">
        <div class="user-block" onclick="openProfile()">
            <div style="width: 40px; height: 40px; border-radius: 50%; background: #fff; color: #000; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-user"></i>
            </div>
            <div style="flex-grow: 1;">
                <div id="u-name" style="font-weight: 700;">Developer</div>
                <div style="font-size: 10px; opacity: 0.8;">Нажми для инфо</div>
            </div>
            <i class="fa-solid fa-chevron-right" style="font-size: 12px; opacity: 0.5;"></i>
        </div>
        <div style="font-size: 11px; opacity: 0.8; letter-spacing: 1px;">ОСНОВНОЙ БАЛАНС</div>
        <div style="font-size: 38px; font-weight: 900;" id="bal">0.00 ₽</div>
    </div>

    <div class="grid">
        <div class="menu-card" onclick="openSettings()">
            <i class="fa-solid fa-sliders"></i><span>Настройки</span>
        </div>
        <div class="menu-card" onclick="tg.HapticFeedback.impactOccurred('light')">
            <i class="fa-solid fa-box-open"></i><span>Мои боты</span>
        </div>
        <div class="menu-card" onclick="window.location.href='https://t.me/твой_саппорт'">
            <i class="fa-solid fa-headset"></i><span>Поддержка</span>
        </div>
        <div class="menu-card" onclick="tg.HapticFeedback.impactOccurred('light')">
            <i class="fa-solid fa-receipt"></i><span>Выплаты</span>
        </div>
    </div>

    <div class="version-tag">APPLICATION VERSION 2.1.5 STABLE</div>
</div>

<div id="profile-modal" class="modal-overlay" onclick="closeProfile()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <i class="fa-solid fa-id-card" style="font-size: 40px; color: var(--accent); margin-bottom: 15px;"></i>
        <h3>Ваш профиль</h3>
        <div style="background: var(--bg); padding: 10px; border-radius: 10px; font-family: monospace; margin: 10px 0;">
            ID: <span id="u-id">Загрузка...</span>
        </div>
        <p style="font-size: 12px; opacity: 0.6;">Статус: Лицензионный Креатор</p>
        <button class="nav-btn" style="width: 100%; margin-top: 15px; padding: 12px;" onclick="closeProfile()">Понятно</button>
    </div>
</div>

<div id="settings-screen" class="full-screen">
    <div class="top-nav">
        <button class="nav-btn" onclick="closeSettings()"><i class="fa-solid fa-chevron-left"></i> Назад</button>
        <b>Настройки</b>
        <div style="width: 60px;"></div>
    </div>
    <div class="container" style="margin-top: 20px;">
        <div class="menu-card" style="text-align: left;">
            <div class="list-item">
                <span>Эффект снега</span>
                <input type="checkbox" checked onchange="toggleSnow(this)">
            </div>
            <div class="list-item">
                <span>Уведомления</span>
                <input type="checkbox" checked>
            </div>
            <div class="list-item" style="border: none;">
                <span>Звуковые эффекты</span>
                <input type="checkbox">
            </div>
        </div>
        <button class="nav-btn" style="padding: 15px; background: #ef4444; color: white;" onclick="tg.close()">Выход из системы</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    if(user) {
        document.getElementById('u-name').innerText = user.first_name;
        document.getElementById('u-id').innerText = user.id;
    }

    function openProfile() {
        document.getElementById('profile-modal').style.display = 'flex';
        tg.HapticFeedback.impactOccurred('medium');
    }
    function closeProfile() {
        document.getElementById('profile-modal').style.display = 'none';
    }

    function openSettings() {
        document.getElementById('settings-screen').style.display = 'flex';
        tg.HapticFeedback.impactOccurred('medium');
    }
    function closeSettings() {
        document.getElementById('settings-screen').style.display = 'none';
    }

    function toggleSnow(el) {
        document.getElementById('snow').style.display = el.checked ? 'block' : 'none';
    }

    // Снег
    const canvas = document.getElementById('snow');
    const ctx = canvas.getContext('2d');
    let flakes = [];
    function initSnow() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        for(let i=0; i<30; i++) flakes.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*2+1, d: Math.random()+0.3});
    }
    function draw() {
        ctx.clearRect(0,0,canvas.width, canvas.height); ctx.fillStyle = "rgba(255,255,255,0.4)";
        ctx.beginPath(); flakes.forEach(f => { ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); f.y+=f.d; if(f.y > canvas.height) f.y = -5; });
        ctx.fill(); requestAnimationFrame(draw);
    }
    initSnow(); draw();
</script>
</body>
</html>

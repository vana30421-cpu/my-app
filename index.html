<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #ffffff);
            --tg-sec-bg: var(--tg-theme-secondary-bg-color, #efeff4);
            --tg-text: var(--tg-theme-text-color, #000000);
            --tg-hint: var(--tg-theme-hint-color, #8e8e93);
            --tg-btn: var(--tg-theme-button-color, #007aff);
            --msg-mine: #dcf8c6;
            --msg-other: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* Красивый стекляный Header */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px); border-bottom: 0.5px solid rgba(0,0,0,0.1);
            position: sticky; top: 0; z-index: 100;
        }

        .close-btn {
            background: #ff3b30; color: white; border: none;
            width: 28px; height: 28px; border-radius: 50%; font-weight: bold;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        /* Экраны */
        .screen { display: none; flex-direction: column; height: 100%; animation: slide 0.3s ease; }
        .screen.active { display: flex; }
        @keyframes slide { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Список чатов */
        .chat-item {
            display: flex; align-items: center; padding: 12px 16px; gap: 15px;
            border-bottom: 0.5px solid rgba(0,0,0,0.05); transition: 0.2s;
        }
        .chat-item:active { background: rgba(0,0,0,0.05); }
        .avatar {
            width: 52px; height: 52px; border-radius: 50%;
            background: linear-gradient(135deg, #007aff, #5ac8fa);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,122,255,0.3);
        }

        /* Сообщения */
        #chat-body { flex: 1; overflow-y: auto; padding: 15px; background: var(--tg-sec-bg); display: flex; flex-direction: column; gap: 10px; }
        .bubble {
            max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 15px;
            line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .bubble.mine { align-self: flex-end; background: var(--msg-mine); border-bottom-right-radius: 4px; }
        .bubble.other { align-self: flex-start; background: var(--msg-other); border-bottom-left-radius: 4px; }

        /* Поле ввода */
        .input-bar {
            padding: 10px 15px; background: var(--tg-bg); display: flex; gap: 10px;
            padding-bottom: env(safe-area-inset-bottom, 10px); align-items: center;
        }
        #msg-input {
            flex: 1; border: 1px solid rgba(0,0,0,0.1); border-radius: 20px;
            padding: 10px 15px; outline: none; background: var(--tg-sec-bg);
        }
    </style>
</head>
<body>

    <div id="screen-list" class="screen active">
        <div class="header">
            <button class="close-btn" onclick="tg.close()">✕</button>
            <div style="text-align: right;">
                <b id="user-name">Загрузка...</b>
                <div style="font-size: 12px; color: #34c759;" id="user-bal">0.00 ₽</div>
            </div>
        </div>
        <div class="chat-item" onclick="openChat('Общий Чат')">
            <div class="avatar">💬</div>
            <div style="flex: 1;">
                <div style="font-weight: 600;">Общий Чат</div>
                <div style="font-size: 14px; color: var(--tg-hint);">Нажмите, чтобы войти</div>
            </div>
        </div>
    </div>

    <div id="screen-chat" class="screen">
        <div class="header">
            <button onclick="showScreen('screen-list')" style="background:none; border:none; color:var(--tg-link); font-size:16px;">❮ Назад</button>
            <b id="chat-title">Чат</b>
            <div style="width: 40px;"></div>
        </div>
        <div id="chat-body"></div>
        <div class="input-bar">
            <input type="text" id="msg-input" placeholder="Сообщение...">
            <button onclick="send()" style="background:var(--tg-btn); color:white; border:none; width:35px; height:35px; border-radius:50%;">➔</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Подгружаем данные пользователя
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
            // Отправляем боту сигнал о входе, чтобы он зарегистрировал в D1
            tg.sendData("auth_login:" + user.id);
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function openChat(name) {
            document.getElementById('chat-title').innerText = name;
            showScreen('screen-chat');
        }

        function send() {
            const inp = document.getElementById('msg-input');
            const val = inp.value.trim();
            if(!val) return;

            // Добавляем в интерфейс мгновенно
            const body = document.getElementById('chat-body');
            body.innerHTML += `<div class="bubble mine">${val}</div>`;
            body.scrollTop = body.scrollHeight;
            
            // РЕАЛЬНАЯ ОТПРАВКА БОТУ
            tg.sendData("msg:" + val);
            
            inp.value = "";
            tg.HapticFeedback.impactOccurred('light');
        }
    </script>
</body>
</html>

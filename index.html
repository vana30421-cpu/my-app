<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --accent: #38bdf8; /* Голубой неоновый */
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 16px;
            overflow-x: hidden;
            user-select: none;
        }

        /* Эффект снега */
        #snow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        /* Контент поверх снега */
        .content { position: relative; z-index: 1; }

        /* Шапка Креатора */
        .creator-header {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            padding: 25px; border-radius: 24px;
            text-align: left; margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.3);
        }

        .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        .balance-title { font-size: 12px; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }
        .balance-main { font-size: 34px; font-weight: 800; }

        /* Сетка управления */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        .btn-card {
            background: var(--secondary-bg);
            border: 1px solid var(--glass);
            padding: 20px; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center;
            transition: all 0.2s; backdrop-filter: blur(10px);
        }

        .btn-card:active { transform: scale(0.92); background: var(--accent); color: white; }

        .btn-card i { font-size: 26px; margin-bottom: 12px; color: var(--accent); }
        .btn-card:active i { color: white; }
        .btn-card span { font-size: 14px; font-weight: 600; }

        /* Кнопка Создать */
        .create-new {
            grid-column: span 2;
            background: rgba(56, 189, 248, 0.1);
            border: 2px dashed var(--accent);
            color: var(--accent);
        }

        /* Статистика полоской */
        .stats-bar {
            margin-top: 25px; background: var(--glass);
            padding: 15px; border-radius: 15px;
            display: flex; justify-content: space-around; font-size: 13px;
        }
        .stat-item b { color: var(--accent); display: block; font-size: 16px; }
    </style>
</head>
<body>

    <canvas id="snow"></canvas>

    <div class="content">
        <div class="creator-header">
            <div class="user-info">
                <div class="user-avatar"><i class="fa-solid fa-user-gear"></i></div>
                <div>
                    <div id="user-name" style="font-weight: 700;">Креатор</div>
                    <div style="font-size: 11px; opacity: 0.7;">Панель разработчика</div>
                </div>
            </div>
            <div class="balance-title">Ваш доход</div>
            <div class="balance-main" id="balance">0.00 ₽</div>
        </div>

        <div class="grid">
            <div class="btn-card create-new" onclick="playClick();">
                <i class="fa-solid fa-plus-circle"></i>
                <span>Создать нового бота</span>
            </div>
            
            <div class="btn-card" onclick="playClick();">
                <i class="fa-solid fa-robot"></i>
                <span>Мои боты</span>
            </div>

            <div class="btn-card" onclick="playClick();">
                <i class="fa-solid fa-gears"></i>
                <span>Настройки</span>
            </div>

            <div class="btn-card" onclick="playClick();">
                <i class="fa-solid fa-chart-line"></i>
                <span>Статистика</span>
            </div>

            <div class="btn-card" onclick="playClick();">
                <i class="fa-solid fa-wallet"></i>
                <span>Выплаты</span>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item"><span id="bots-count">0</span><b>Ботов</b></div>
            <div class="stat-item"><span id="users-total">0</span><b>Юзеров</b></div>
            <div class="stat-item"><span id="days-active">1</span><b>Дней</b></div>
        </div>
    </div>

    <audio id="click-sound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3" preload="auto"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Звук и вибрация
        function playClick() {
            const sound = document.getElementById('click-sound');
            sound.currentTime = 0;
            sound.play();
            tg.HapticFeedback.impactOccurred('medium');
        }

        // Данные пользователя
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
            // Здесь запрос к твоему воркеру для получения статы креатора
            fetch(`https://твой-воркер.workers.dev/api/creator_stats?id=${user.id}`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('balance').innerText = data.balance.toFixed(2) + ' ₽';
                    document.getElementById('bots-count').innerText = data.botsCount;
                });
        }

        // Логика снега
        const canvas = document.getElementById('snow');
        const ctx = canvas.getContext('2d');
        let flakes = [];

        function initSnow() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            for(let i=0; i<50; i++) {
                flakes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 3 + 1,
                    d: Math.random() * 1
                });
            }
        }

        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            ctx.beginPath();
            for(let i=0; i<flakes.length; i++) {
                let f = flakes[i];
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.r, 0, Math.PI*2, true);
            }
            ctx.fill();
            moveSnow();
        }

        function moveSnow() {
            for(let i=0; i<flakes.length; i++) {
                let f = flakes[i];
                f.y += Math.pow(f.d, 2) + 1;
                if(f.y > canvas.height) {
                    flakes[i] = {x: Math.random()*canvas.width, y: 0, r: f.r, d: f.d};
                }
            }
        }

        initSnow();
        setInterval(drawSnow, 30);
    </script>
</body>
</html>
